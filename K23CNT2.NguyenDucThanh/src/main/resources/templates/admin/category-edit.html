<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa danh mục - SneakerNDT Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- 1. SIDEBAR --- */
        .ndt-admin-sidebar {
            width: 250px;
            height: 100vh;
            background: #111827;
            color: #9ca3af;
            position: fixed;
            top: 0; left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .ndt-sidebar-header {
            height: 60px;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-weight: 700;
            color: #fff;
            font-size: 18px;
            border-bottom: 1px solid #1f2937;
        }

        .ndt-sidebar-menu {
            padding-top: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin-bottom: 10px;
            padding-left: 20px;
            font-weight: 600;
        }

        .ndt-admin-sidebar a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .ndt-admin-sidebar a i {
            width: 24px;
            text-align: center;
            margin-right: 10px;
        }

        .ndt-admin-sidebar a:hover,
        .ndt-admin-sidebar a.active {
            background: #1f2937;
            color: #fff;
            border-left-color: #3b82f6;
        }

        /* --- 2. TOPBAR --- */
        .ndt-admin-topbar {
            height: 60px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            margin-left: 250px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: fixed;
            top: 0; right: 0; left: 0;
            z-index: 999;
        }

        /* --- 3. MAIN CONTENT --- */
        .ndt-admin-content {
            margin-left: 250px;
            padding: 90px 30px 30px 30px;
        }

        /* --- 4. FORM STYLE --- */
        .form-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: none;
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-control {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Khung xem trước ảnh */
        .img-preview-box {
            width: 100%;
            height: 200px;
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 10px;
        }
        .img-preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<aside class="ndt-admin-sidebar">
    <div class="ndt-sidebar-header">
        <i class="fa-solid fa-shoe-prints me-2"></i> SneakerNDT Admin
    </div>

    <div class="ndt-sidebar-menu">
        <div class="menu-label">Quản lý</div>

        <a th:href="@{/ndt-admin}">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>

        <a th:href="@{/ndt-admin/products}">
            <i class="fa-solid fa-shoe-prints"></i> Sản phẩm
        </a>

        <a th:href="@{/ndt-admin/categories}" class="active">
            <i class="fa-solid fa-tags"></i> Danh mục
        </a>

        <a th:href="@{/ndt-admin/inventory}">
            <i class="fa-solid fa-boxes-stacked"></i> Kho hàng
        </a>

        <a th:href="@{/ndt-admin/orders}">
            <i class="fa-solid fa-receipt"></i> Đơn hàng
        </a>

        <a th:href="@{/ndt-admin/users}">
            <i class="fa-solid fa-users"></i> Người dùng
        </a>
    </div>
</aside>

<div class="ndt-admin-topbar">
    <div class="fw-bold fs-5 text-dark">Sửa danh mục</div>
    <div>
        <a th:href="@{/ndt-admin/categories}" class="btn btn-outline-secondary btn-sm me-2">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
        </a>
    </div>
</div>

<div class="ndt-admin-content">

    <div class="form-card">
        <form th:action="@{'/ndt-admin/categories/edit/' + ${category.id}}"
              th:object="${category}" method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="mb-3">
                        <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{categoryName}" required placeholder="Nhập tên danh mục...">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" th:field="*{description}" rows="5" placeholder="Mô tả danh mục..."></textarea>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="p-3 bg-light rounded-3">
                        <label class="form-label">Ảnh đại diện</label>
                        <input type="text" class="form-control mb-2" id="imgInput"
                               th:field="*{imgUrl}"
                               placeholder="Tên file (vd: adidas.png)..."
                               oninput="updateImagePreview()">

                        <div class="form-text mb-2">Ảnh từ thư mục <code>/Img/</code></div>

                        <div class="img-preview-box">
                            <img id="imgPreview"
                                 th:src="${category.imgUrl != null} ? @{'/Img/' + ${category.imgUrl}} : ''"
                                 onerror="this.src='/Img/default.png'"
                                 alt="Preview">
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-primary px-4 fw-bold">
                    <i class="fa-solid fa-save me-2"></i> Cập nhật
                </button>
                <a th:href="@{/ndt-admin/categories}" class="btn btn-secondary px-4 fw-bold">
                    Hủy bỏ
                </a>
            </div>
        </form>
    </div>

</div>

<script>
    function updateImagePreview() {
        const input = document.getElementById('imgInput');
        const img = document.getElementById('imgPreview');
        const val = input.value.trim();

        if (val) {
            if (val.startsWith('http')) {
                img.src = val;
            } else {
                img.src = '/Img/' + val;
            }
            img.style.display = 'block';
        } else {
            img.src = '/Img/default.png'; // Ảnh mặc định nếu xóa trống
        }
    }

    // Chạy khi load trang để hiện ảnh cũ (nếu có)
    document.addEventListener("DOMContentLoaded", function() {
        updateImagePreview();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
