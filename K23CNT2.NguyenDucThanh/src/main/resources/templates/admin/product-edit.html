<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa sản phẩm - SneakerNDT Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        /* --- 1. SỬA LỖI KHOẢNG TRẮNG SIDEBAR --- */
        body {
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Tránh thanh cuộn ngang */
        }

        /* Wrapper bao quanh toàn bộ, bắt buộc cao tối thiểu bằng màn hình */
        .ndt-admin-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .ndt-admin-sidebar {
            width: 250px; /* Tăng nhẹ độ rộng cho đẹp */
            background: #111827;
            color: #e5e7eb;
            flex-shrink: 0; /* Không cho sidebar bị co lại */
            display: flex;
            flex-direction: column;
        }

        .ndt-admin-sidebar .logo {
            height: 60px;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background-color: #0f1523; /* Màu tối hơn chút cho logo */
            border-bottom: 1px solid #1f2937;
        }

        .ndt-admin-sidebar a {
            display: block;
            padding: 12px 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            border-left: 3px solid transparent; /* Tạo viền ẩn bên trái */
            transition: all 0.2s;
        }

        .ndt-admin-sidebar a i {
            width: 24px;
            text-align: center;
            margin-right: 8px;
        }

        .ndt-admin-sidebar a:hover,
        .ndt-admin-sidebar a.active {
            background: #1f2937;
            color: #fff;
            border-left-color: #3b82f6; /* Viền xanh khi active */
        }

        .ndt-admin-main {
            flex-grow: 1;
            background: #f5f6fa;
            padding: 20px;
            overflow-y: auto; /* Cho phép cuộn nội dung chính */
        }

        /* Style cho khung ảnh xem trước */
        .img-preview-box {
            width: 100%;
            height: 250px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            overflow: hidden;
            margin-top: 10px;
        }
        .img-preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<div class="ndt-admin-wrapper">

    <aside class="ndt-admin-sidebar">
        <div class="logo">
            <i class="fa-solid fa-shoe-prints me-2"></i> SneakerNDT Admin
        </div>

        <div class="py-2">
            <div class="px-3 mb-2 mt-2 text-uppercase small text-secondary fw-bold" style="font-size: 11px;">Menu Quản lý</div>

            <a th:href="@{/ndt-admin}">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a>

            <a th:href="@{/ndt-admin/products}" class="active">
                <i class="fa-solid fa-shoe-prints"></i> Sản phẩm
            </a>

            <a th:href="@{/ndt-admin/categories}">
                <i class="fa-solid fa-tags"></i> Danh mục
            </a>

            <a th:href="@{/ndt-admin/inventory}">
                <i class="fa-solid fa-boxes-stacked"></i> Kho hàng
            </a>

            <a th:href="@{/ndt-admin/orders}">
                <i class="fa-solid fa-receipt"></i> Đơn hàng
            </a>

            <a th:href="@{/ndt-admin/users}">
                <i class="fa-solid fa-users"></i> Người dùng
            </a>
        </div>
    </aside>

    <main class="ndt-admin-main">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-0"
                    th:text="${product.id == null ? 'Thêm sản phẩm mới' : 'Cập nhật sản phẩm'}">
                    Tiêu đề
                </h3>

                <span class="text-muted small" th:if="${product.id != null}">
        ID sản phẩm: <span class="fw-bold text-primary" th:text="'#' + ${product.id}"></span>
    </span>
            </div>
            <a class="btn btn-secondary" th:href="@{/ndt-admin/products}">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
            </a>
        </div>

        <div th:if="${msg}" class="alert alert-success d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <div th:text="${msg}"></div>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <form th:action="@{/ndt-admin/products/save}" th:object="${product}" method="post">

                    <input type="hidden" th:field="*{id}"/>

                    <div class="row g-4">
                        <div class="col-lg-8">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-bold">Tên sản phẩm</label>
                                    <input type="text" class="form-control" th:field="*{name}" required placeholder="Nhập tên giày...">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Giá bán (VNĐ)</label>
                                    <input type="number" min="0" class="form-control" th:field="*{price}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Số lượng trong kho</label>
                                    <input type="number" min="0" class="form-control" th:field="*{quantity}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Giảm giá (%)</label>
                                    <input type="number" min="0" max="100" class="form-control" th:field="*{discountPercent}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Danh mục</label>
                                    <select class="form-select" th:field="*{category.id}">
                                        <option value="">-- Chọn danh mục --</option>
                                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.categoryName}"></option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Mô tả sản phẩm</label>
                                    <textarea class="form-control" rows="5" th:field="*{description}" placeholder="Mô tả chi tiết..."></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="p-3 bg-light rounded-3">
                                <label class="form-label fw-bold">Trạng thái kinh doanh</label>
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label" for="isActive">Đang bán</label>
                                </div>

                                <hr>

                                <label class="form-label fw-bold">Link ảnh (Tên file)</label>
                                <input type="text" class="form-control mb-2" id="imgInput"
                                       th:field="*{imgUrl}"
                                       placeholder="Ví dụ: nike-air.jpg"
                                       oninput="updateImagePreview()">

                                <small class="text-muted d-block mb-2">Ảnh sẽ được lấy từ thư mục <code>/Img/</code></small>

                                <label class="form-label fw-bold">Xem trước ảnh</label>
                                <div class="img-preview-box">
                                    <img id="imgPreview"
                                         th:src="${product.imgUrl != null} ? @{'/Img/' + ${product.imgUrl}} : @{/Img/default.png}"
                                         onerror="this.src='/Img/default.png'"
                                         alt="Ảnh xem trước">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Cập nhật sản phẩm
                        </button>
                        <a class="btn btn-outline-secondary px-4" th:href="@{/ndt-admin/products}">
                            Hủy bỏ
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script>
    function updateImagePreview() {
        // Lấy giá trị từ ô input
        const imgName = document.getElementById('imgInput').value;
        const imgPreview = document.getElementById('imgPreview');

        if (imgName && imgName.trim() !== "") {
            // Nếu là link online (http) thì giữ nguyên, nếu là tên file thì thêm /Img/
            if (imgName.startsWith("http")) {
                imgPreview.src = imgName;
            } else {
                imgPreview.src = "/Img/" + imgName;
            }
        } else {
            imgPreview.src = "/Img/default.png";
        }
    }
</script>

</body>
</html>
