<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm sản phẩm mới - SneakerNDT Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- 1. SIDEBAR --- */
        .ndt-admin-sidebar {
            width: 250px;
            height: 100vh;
            background: #111827;
            color: #9ca3af;
            position: fixed;
            top: 0; left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .ndt-sidebar-header {
            height: 60px;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-weight: 700;
            color: #fff;
            font-size: 18px;
            border-bottom: 1px solid #1f2937;
        }

        .ndt-sidebar-menu {
            padding-top: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin-bottom: 10px;
            padding-left: 20px;
            font-weight: 600;
        }

        .ndt-admin-sidebar a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .ndt-admin-sidebar a i {
            width: 24px;
            text-align: center;
            margin-right: 10px;
        }

        .ndt-admin-sidebar a:hover,
        .ndt-admin-sidebar a.active {
            background: #1f2937;
            color: #fff;
            border-left-color: #3b82f6;
        }

        /* --- 2. TOPBAR --- */
        .ndt-admin-topbar {
            height: 60px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            margin-left: 250px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: fixed;
            top: 0; right: 0; left: 0;
            z-index: 999;
        }

        /* --- 3. MAIN CONTENT --- */
        .ndt-admin-content {
            margin-left: 250px;
            padding: 90px 30px 30px 30px;
        }

        /* --- 4. FORM STYLE --- */
        .form-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: none;
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Khung xem trước ảnh */
        .img-preview-box {
            width: 100%;
            height: 250px;
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 10px;
        }
        .img-preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .img-preview-placeholder {
            color: #9ca3af;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<aside class="ndt-admin-sidebar">
    <div class="ndt-sidebar-header">
        <i class="fa-solid fa-shoe-prints me-2"></i> SneakerNDT Admin
    </div>

    <div class="ndt-sidebar-menu">
        <div class="menu-label">Quản lý</div>

        <a th:href="@{/ndt-admin}">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>

        <a th:href="@{/ndt-admin/products}" class="active">
            <i class="fa-solid fa-shoe-prints"></i> Sản phẩm
        </a>

        <a th:href="@{/ndt-admin/categories}">
            <i class="fa-solid fa-tags"></i> Danh mục
        </a>

        <a th:href="@{/ndt-admin/inventory}">
            <i class="fa-solid fa-boxes-stacked"></i> Kho hàng
        </a>

        <a th:href="@{/ndt-admin/orders}">
            <i class="fa-solid fa-receipt"></i> Đơn hàng
        </a>

        <a th:href="@{/ndt-admin/users}">
            <i class="fa-solid fa-users"></i> Người dùng
        </a>
    </div>
</aside>

<div class="ndt-admin-topbar">
    <div class="fw-bold fs-5 text-dark">Thêm sản phẩm</div>
    <div>
        <a th:href="@{/ndt-admin/products}" class="btn btn-outline-secondary btn-sm me-2">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
        </a>
    </div>
</div>

<div class="ndt-admin-content">

    <div th:if="${msg}" class="alert alert-success d-flex align-items-center mb-4" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <div th:text="${msg}"></div>
    </div>

    <div class="form-card">
        <form th:action="@{/ndt-admin/products/create}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="row g-4">
                <div class="col-lg-8">

                    <div class="mb-3">
                        <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}" required placeholder="Nhập tên giày...">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control" th:field="*{price}" required placeholder="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Số lượng kho <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control" th:field="*{quantity}" required placeholder="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Giảm giá (%)</label>
                            <input type="number" min="0" max="100" class="form-control" th:field="*{discountPercent}" placeholder="0">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Danh mục <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{category.id}" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="c : ${categories}"
                                        th:value="${c.id}"
                                        th:text="${c.categoryName}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Trạng thái</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="isActiveSwitch" th:field="*{isActive}">
                                <label class="form-check-label" for="isActiveSwitch">Đang bán (Hiển thị ngay)</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả chi tiết</label>
                        <textarea class="form-control" rows="5" th:field="*{description}" placeholder="Mô tả sản phẩm..."></textarea>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="p-3 bg-light rounded-3">
                        <label class="form-label">Ảnh sản phẩm</label>
                        <input type="text" class="form-control mb-2" id="imgInput"
                               th:field="*{imgUrl}"
                               placeholder="Nhập tên file (vd: nike.jpg)..."
                               oninput="updateImagePreview()">

                        <div class="form-text mb-3">Ảnh được lấy từ thư mục <code>/Img/</code></div>

                        <div class="img-preview-box">
                            <img id="imgPreview" src="" alt="" style="display: none;">
                            <div id="imgPlaceholder" class="img-preview-placeholder">
                                <i class="fa-regular fa-image fs-1 mb-2"></i><br>
                                Ảnh xem trước sẽ hiện tại đây
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-primary px-4 fw-bold">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Lưu sản phẩm
                </button>
                <a class="btn btn-secondary px-4 fw-bold" th:href="@{/ndt-admin/products}">
                    Hủy bỏ
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    function updateImagePreview() {
        const input = document.getElementById('imgInput');
        const img = document.getElementById('imgPreview');
        const placeholder = document.getElementById('imgPlaceholder');
        const val = input.value.trim();

        if (val) {
            // Nếu người dùng nhập http thì giữ nguyên, nếu không thì thêm /Img/
            if (val.startsWith('http')) {
                img.src = val;
            } else {
                img.src = '/Img/' + val;
            }
            img.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            img.style.display = 'none';
            img.src = '';
            placeholder.style.display = 'block';
        }
    }

    // Chạy 1 lần khi load trang (phòng trường hợp form validation failed load lại trang cũ)
    document.addEventListener("DOMContentLoaded", function() {
        updateImagePreview();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
