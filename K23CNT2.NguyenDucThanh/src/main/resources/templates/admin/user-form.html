<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.id == null ? 'Thêm người dùng' : 'Cập nhật người dùng'}">User Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- 1. SIDEBAR --- */
        .ndt-admin-sidebar {
            width: 250px;
            height: 100vh;
            background: #111827;
            color: #9ca3af;
            position: fixed;
            top: 0; left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .ndt-sidebar-header {
            height: 60px;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-weight: 700;
            color: #fff;
            font-size: 18px;
            border-bottom: 1px solid #1f2937;
        }

        .ndt-sidebar-menu {
            padding-top: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin-bottom: 10px;
            padding-left: 20px;
            font-weight: 600;
        }

        .ndt-admin-sidebar a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }

        .ndt-admin-sidebar a i {
            width: 24px;
            text-align: center;
            margin-right: 10px;
        }

        .ndt-admin-sidebar a:hover,
        .ndt-admin-sidebar a.active {
            background: #1f2937;
            color: #fff;
            border-left-color: #3b82f6;
        }

        /* --- 2. TOPBAR --- */
        .ndt-admin-topbar {
            height: 60px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            margin-left: 250px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: fixed;
            top: 0; right: 0; left: 0;
            z-index: 999;
        }

        /* --- 3. MAIN CONTENT --- */
        .ndt-admin-content {
            margin-left: 250px;
            padding: 90px 30px 30px 30px;
        }

        /* --- 4. FORM STYLE --- */
        .form-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: none;
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body>

<aside class="ndt-admin-sidebar">
    <div class="ndt-sidebar-header">
        <i class="fa-solid fa-shoe-prints me-2"></i> SneakerNDT Admin
    </div>

    <div class="ndt-sidebar-menu">
        <div class="menu-label">Quản lý</div>

        <a th:href="@{/ndt-admin}">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>

        <a th:href="@{/ndt-admin/products}">
            <i class="fa-solid fa-shoe-prints"></i> Sản phẩm
        </a>

        <a th:href="@{/ndt-admin/categories}">
            <i class="fa-solid fa-tags"></i> Danh mục
        </a>

        <a th:href="@{/ndt-admin/inventory}">
            <i class="fa-solid fa-boxes-stacked"></i> Kho hàng
        </a>

        <a th:href="@{/ndt-admin/orders}">
            <i class="fa-solid fa-receipt"></i> Đơn hàng
        </a>

        <a th:href="@{/ndt-admin/users}" class="active">
            <i class="fa-solid fa-users"></i> Người dùng
        </a>
    </div>
</aside>

<div class="ndt-admin-topbar">
    <div class="fw-bold fs-5 text-dark"
         th:text="${user.id == null ? 'Thêm người dùng mới' : 'Cập nhật thông tin người dùng'}">
        User Form
    </div>
    <div>
        <a th:href="@{/ndt-admin/users}" class="btn btn-outline-secondary btn-sm me-2">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
        </a>
    </div>
</div>

<div class="ndt-admin-content">

    <div class="form-card" style="max-width: 800px; margin: 0 auto;">
        <form th:action="@{/ndt-admin/users/save}" th:object="${user}" method="post">

            <input type="hidden" th:field="*{id}">

            <h5 class="mb-4 text-primary fw-bold">
                <i class="fa-solid fa-user-gear me-2"></i> Thông tin tài khoản
            </h5>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{username}" required placeholder="Nhập tên đăng nhập...">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" th:field="*{password}"
                           th:required="${user.id == null}"
                           placeholder="Để trống nếu không muốn đổi mật khẩu...">
                </div>

                <div class="col-12">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="Nhập họ tên đầy đủ...">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="example@email.com">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" class="form-control" th:field="*{phone}" placeholder="09xxxx...">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Vai trò (Role)</label>
                    <select class="form-select" th:field="*{role}">
                        <option th:each="r : ${roles}"
                                th:value="${r.id}"
                                th:text="${r.roleName}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6 d-flex align-items-end pb-2">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="activeCheck">
                        <label class="form-check-label fw-bold" for="activeCheck">Đang hoạt động (Active)</label>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4 pt-3 border-top justify-content-end">
                <a th:href="@{/ndt-admin/users}" class="btn btn-secondary px-4 fw-bold">
                    Hủy bỏ
                </a>
                <button type="submit" class="btn btn-primary px-4 fw-bold">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Lưu lại
                </button>
            </div>

        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
